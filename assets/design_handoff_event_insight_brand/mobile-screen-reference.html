<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Insight — Mobile Dashboard (reference)</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ===== Design tokens ===== */
  :root{
    --orange:#E4772A;          /* Signal Orange — primary accent */
    --ink:#1B2B3A;             /* Ink Navy — dark surfaces */
    --text:#17262D;            /* primary text */
    --teal:#2CA5C0;            /* Insight Teal — secondary */
    --eyebrow:#7FC4D6;         /* teal tint on navy */
    --paper:#F6F5F1;           /* app background */
    --slate:#5D6B70;           /* secondary text */
    --muted:#8A9499;           /* tertiary text */
    --border:#E5E3DC;          /* card borders */
    --font-display:'Archivo',sans-serif;
    --font-body:'Public Sans',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;}
  body{background:#EFEDE7;font-family:var(--font-body);display:flex;justify-content:center;padding:40px;}

  /* ===== Screen: 336x720 (~19.5:9) ===== */
  .screen{width:336px;height:720px;background:var(--paper);border-radius:34px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(23,38,45,.22);}

  /* ===== Header ===== */
  .header{background:var(--ink);padding:0 22px 26px;position:relative;overflow:hidden;flex:0 0 auto;}
  .header .watermark{position:absolute;top:23px;left:157px;width:237px;height:120px;object-fit:contain;pointer-events:none;opacity:.1;}
  .header .inner{position:relative;z-index:1;}
  .statusbar{display:flex;justify-content:space-between;align-items:center;height:44px;font-family:var(--font-mono);font-size:12px;color:#C6D4D9;}
  .statusbar .right{display:flex;gap:8px;align-items:center;}
  .battery{width:16px;height:9px;border:1.5px solid #C6D4D9;border-radius:2px;}
  .avatar{width:22px;height:22px;border-radius:50%;background:#2A3B43;}
  .eyebrow{font-family:var(--font-mono);font-size:9.5px;white-space:nowrap;letter-spacing:.315em;text-transform:uppercase;color:var(--eyebrow);}
  .wordmark{display:flex;align-items:baseline;font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1;margin-top:12px;}
  .wordmark .event{color:var(--orange);}
  .wordmark .insight{color:#fff;}
  .header .label{color:#9FB2B8;font-size:12px;margin-top:18px;}
  .header .stat{display:flex;align-items:baseline;gap:8px;}
  .header .stat .num{font-family:var(--font-display);font-weight:800;font-size:38px;color:#fff;}
  .pill-urgent{color:var(--orange);font-size:13px;font-weight:600;background:rgba(228,119,42,.16);padding:3px 8px;border-radius:20px;}

  /* ===== Body ===== */
  .body{padding:20px 16px 16px;flex:1;display:flex;flex-direction:column;}
  .tiles{display:flex;gap:8px;margin-bottom:16px;}
  .tile{flex:1;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;}
  .tile .value{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--text);}
  .tile .value.teal{color:var(--teal);}
  .tile .value small{font-size:13px;color:var(--muted);font-weight:800;}
  .tile .caption{font-size:11px;color:var(--slate);margin-top:2px;}
  .section-title{font-family:var(--font-display);font-weight:700;font-size:14px;margin-bottom:10px;color:var(--text);}

  .event-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
  .event-card.high{border-left:4px solid var(--orange);}
  .event-card.review{border-left:4px solid var(--teal);}
  .event-card .row{display:flex;justify-content:space-between;align-items:center;}
  .event-card .id{font-family:var(--font-mono);font-size:10px;color:var(--muted);}
  .tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
  .tag.high{color:var(--orange);background:rgba(228,119,42,.12);}
  .tag.review{color:var(--teal);background:rgba(44,165,192,.14);}
  .event-card .title{font-weight:600;font-size:14px;margin:6px 0 4px;color:var(--text);}
  .event-card .meta{font-size:12px;color:var(--slate);}

  .cta{background:var(--orange);border:none;border-radius:12px;padding:14px;text-align:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:14px;margin-top:auto;width:100%;cursor:pointer;}

  /* ===== Tab bar ===== */
  .tabbar{display:flex;justify-content:space-around;padding:14px 0 18px;background:#fff;border-top:1px solid var(--border);flex:0 0 auto;}
  .tab{width:22px;height:22px;border-radius:6px;background:#D8DDDE;}
  .tab.active{background:var(--orange);}
</style>
</head>
<body>
  <div class="screen">
    <header class="header">
      <img class="watermark" src="assets/id-mark.png" alt="">
      <div class="inner">
        <div class="statusbar">
          <span>9:41</span>
          <span class="right"><span class="battery"></span><span class="avatar"></span></span>
        </div>
        <div class="eyebrow">By Investigations Differently</div>
        <div class="wordmark"><span class="event">Event</span><span class="insight">Insight</span></div>
        <div class="label">Open investigations</div>
        <div class="stat"><span class="num">12</span><span class="pill-urgent">3 urgent</span></div>
      </div>
    </header>

    <main class="body">
      <div class="tiles">
        <div class="tile"><div class="value">87<small>%</small></div><div class="caption">Closed on time</div></div>
        <div class="tile"><div class="value teal">4.2<small>d</small></div><div class="caption">Avg. resolution</div></div>
      </div>
      <div class="section-title">Recent events</div>
      <div class="event-card high">
        <div class="row"><span class="id">EVT-2041</span><span class="tag high">HIGH</span></div>
        <div class="title">Near-miss · loading dock</div>
        <div class="meta">Investigation in progress · assigned to K. Rao</div>
      </div>
      <div class="event-card review">
        <div class="row"><span class="id">EVT-2038</span><span class="tag review">REVIEW</span></div>
        <div class="title">Equipment failure · Line 3</div>
        <div class="meta">Root-cause drafted · awaiting sign-off</div>
      </div>
      <button class="cta">Log new event</button>
    </main>

    <nav class="tabbar">
      <span class="tab active"></span><span class="tab"></span><span class="tab"></span><span class="tab"></span>
    </nav>
  </div>
</body>
</html>
